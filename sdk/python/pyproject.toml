[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgraph-sdk"
version = "2.0.0"
description = "Zero-dependency Python SDK for building conformant Context Graph Protocol providers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["context-graph-protocol", "cgp", "context", "provider", "sdk"]
dependencies = []

# Optional, and only for producing attestations. Verification, hashing and the
# provider runtime stay zero-dependency; without this extra the signing
# functions raise SigningUnavailableError rather than answering differently.
# See contextgraph_sdk/_signing.py for why the SDK never signs in pure Python.
[project.optional-dependencies]
signing = ["cryptography>=41"]

[project.urls]
Homepage = "https://contextgraphprotocol.org"
Repository = "https://github.com/macanderson/context-graph-protocol"
Issues = "https://github.com/macanderson/context-graph-protocol/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextgraph_sdk*"]

[tool.setuptools.package-data]
contextgraph_sdk = ["py.typed"]
