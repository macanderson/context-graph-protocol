[package]
name = "contextgraph-treesitter"
description = "Reference Context Graph Protocol provider: parses Rust source into Symbol + Graph frames with code.defines/calls/imports edges over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A reference provider binary, not part of the published crate set.
publish = false

[dependencies]
contextgraph-refprov = { path = "../contextgraph-refprov" }
contextgraph-types = { path = "../contextgraph-types" }

[[bin]]
name = "contextgraph-treesitter"
path = "src/main.rs"
