name: CI

# For a project whose pitch is "conformance is a test you run in CI", the spec
# repo not running conformance in CI was a credibility gap. Every normative
# guarantee below is machine-verified on every PR: the suite goes green on a
# conformant provider AND red on each deliberately-broken one, because a suite
# that only ever passes proves nothing.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # `attestation` is off by default, so the line above reaches
      # contextgraph_types::attest and the cross-language vectors the SDK
      # suites reconcile against only through feature unification with
      # contextgraph-conformance's dev-dependency. That is a resolver detail,
      # and a guarantee resting on one is not a guarantee: ask for the feature
      # by name, so those constructions are checked whatever the resolver
      # decides and whatever any other crate happens to request.
      - run: cargo test -p contextgraph-types --features attestation

  features:
    name: contextgraph-types feature matrix
    runs-on: ubuntu-latest
    # `test` above builds with default features, and every feature this crate
    # has is off by default — so until this job existed, the attestation and
    # record-hashing code, and the vectors that pin their wire format, compiled
    # nowhere in CI. A cryptographic surface no job builds is a surface nothing
    # defends.
    #
    # Each combination is built on its own rather than only `--all-features`:
    # the point of the split is that a consumer of one layer does not drag in
    # the other's dependencies, and only a build with exactly one feature on can
    # catch a `cfg` that silently relies on the other being enabled too.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p contextgraph-types --all-features --all-targets -- -D warnings
      - run: cargo test -p contextgraph-types --all-features
      - run: cargo test -p contextgraph-types --features attestation
      - run: cargo test -p contextgraph-types --features record-hash
      - run: cargo test -p contextgraph-types --features record-attestation

      # The job above defends the features that exist today. This defends the
      # next one: a feature added to the crate without a line here would leave
      # its gated vector file compiling to zero tests, and cargo reports that as
      # success (#117). The guard reads the crate's [features] table and this
      # job's own commands and fails when they disagree, so the job's coverage
      # is checkable rather than something somebody has to remember.
      - name: every declared feature is built by this job
        run: python3 .github/scripts/check-feature-matrix.py

  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read the pinned MSRV rather than hardcoding it, so bumping
      # `workspace.package.rust-version` cannot silently desynchronize CI from
      # the version the crates claim to support.
      - id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "Detected MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # This job is the one place that must NOT use the pinned toolchain, and
      # since `rust-toolchain.toml` landed it is also the one place that has to
      # say so out loud. The action above installs the MSRV and makes it the
      # rustup *default*, but rustup ranks a `rust-toolchain.toml` file above
      # the default — so with the file present, `cargo build` here would
      # silently use the pin and this job would prove the crates build on the
      # newest compiler while claiming to prove they build on the oldest. A job
      # that reports a guarantee it did not test is worse than no job.
      #
      # `RUSTUP_TOOLCHAIN` outranks the file, so this is the override that
      # restores the job's meaning. Its value is the MSRV read from
      # `Cargo.toml`, never the pin: the two numbers answer different
      # questions and must keep moving independently.
      - run: cargo build --workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  rustdoc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    # docs.rs is the surface a third-party implementer reads these crates
    # through (`contextgraph-types` builds there with `all-features = true`),
    # and until this job existed nothing ever built it: `cargo doc` had gone
    # red on main on redundant, private, and unresolved intra-doc links —
    # three of them pointed at nothing at all (#122).
    # `--all-features` matches what docs.rs renders; `--no-deps` keeps the run
    # to this workspace's own docs, which are the only ones it can fix.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  conformance:
    name: conformance (green and --misbehave red)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - name: Suite is green against the conformant fixture
        run: ./.github/scripts/conformance-green.sh
      - name: Suite is red against every --misbehave mode
        run: ./.github/scripts/conformance-red.sh
      - name: Reference host upholds every host-binding rule (§11.1, #14)
        run: ./.github/scripts/host-conformance.sh

  reference-provider-ripgrep:
    name: reference provider (ripgrep) is conformant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      # No target-dir argument: the provider defaults to its bundled fixtures/,
      # so the run is hermetic and reproducible.
      - name: ripgrep reference provider passes the conformance suite
        run: ./.github/scripts/conformance-external.sh -- ./target/debug/contextgraph-ripgrep

  reference-provider-treesitter:
    name: reference provider (treesitter) is conformant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - name: treesitter reference provider passes the conformance suite
        run: ./.github/scripts/conformance-external.sh -- ./target/debug/contextgraph-treesitter

  mcp-bridge:
    name: mcp→cgp bridge is a conformant provider
    runs-on: ubuntu-latest
    # Self-contained: builds the hermetic in-repo MCP fixture server and the
    # bridge that wraps it, then runs the same external conformance gate the SDK
    # example providers pass. No network, no npx — the fixture is the MCP server.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - name: Bridge wrapping the in-repo MCP fixture passes the conformance suite
        run: |
          ./.github/scripts/conformance-external.sh \
            -- ./target/debug/contextgraph-mcp-bridge \
               -- ./target/debug/contextgraph-mcp-fixture

  sdk-typescript:
    name: sdk (typescript) is a conformant implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm install
          npm run build
      - name: TS example provider passes the conformance suite
        run: ./.github/scripts/conformance-external.sh -- node sdk/typescript/dist/examples/example-docs.js
      - name: TS attestation port reproduces the published vectors
        working-directory: sdk/typescript
        run: node --test "dist/test/*.test.js"

  sdk-python:
    name: sdk (python) is a conformant implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python example provider passes the conformance suite
        run: ./.github/scripts/conformance-external.sh -- python3 sdk/python/examples/example_docs.py
      - name: Python attestation port reproduces the published vectors
        working-directory: sdk/python
        run: python3 -m unittest discover -s tests -v

  sdk-go:
    name: sdk (go) is a conformant implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Vet and build the Go SDK
        working-directory: sdk/go
        run: |
          go vet ./...
          go build -o "$GITHUB_WORKSPACE/cg-go-example" ./examples/example-docs
      - name: Go example provider passes the conformance suite
        run: ./.github/scripts/conformance-external.sh -- ./cg-go-example
      - name: Go attestation port reproduces the published vectors
        working-directory: sdk/go
        run: go test ./contextgraph/attest/

  sdk-typescript-http:
    name: sdk (typescript) HTTP adapter is conformant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm install
          npm run build
      - name: TS HTTP example passes the conformance suite
        run: |
          PORT=8787 node sdk/typescript/dist/examples/example-docs-http.js &
          SERVER=$!
          for _ in $(seq 1 40); do
            curl -sf -X POST http://127.0.0.1:8787 \
              -d '{"type":"handshake","protocol_version":"contextgraph/1.0-draft"}' >/dev/null && break
            sleep 0.25
          done
          ./target/debug/contextgraph-inspect http http://127.0.0.1:8787
          code=$?
          kill $SERVER 2>/dev/null || true
          exit $code

  sdk-python-http:
    name: sdk (python) HTTP adapter is conformant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python HTTP example passes the conformance suite
        run: |
          PORT=8788 python3 sdk/python/examples/example_docs_http.py &
          SERVER=$!
          for _ in $(seq 1 40); do
            curl -sf -X POST http://127.0.0.1:8788 \
              -d '{"type":"handshake","protocol_version":"contextgraph/1.0-draft"}' >/dev/null && break
            sleep 0.25
          done
          ./target/debug/contextgraph-inspect http http://127.0.0.1:8788
          code=$?
          kill $SERVER 2>/dev/null || true
          exit $code

  sdk-go-http:
    name: sdk (go) HTTP adapter is conformant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Build the Go HTTP example
        working-directory: sdk/go
        run: go build -o "$GITHUB_WORKSPACE/cg-go-http" ./examples/example-docs-http
      - name: Go HTTP example passes the conformance suite
        run: |
          PORT=8789 ./cg-go-http &
          SERVER=$!
          for _ in $(seq 1 40); do
            curl -sf -X POST http://127.0.0.1:8789 \
              -d '{"type":"handshake","protocol_version":"contextgraph/1.0-draft"}' >/dev/null && break
            sleep 0.25
          done
          ./target/debug/contextgraph-inspect http http://127.0.0.1:8789
          code=$?
          kill $SERVER 2>/dev/null || true
          exit $code

  sdk-typescript-types:
    name: sdk (typescript) typechecks
    runs-on: ubuntu-latest
    # `sdk (typescript) is a conformant implementation` runs `npm run build`,
    # which is `tsc`, so a type error does redden something today — but only
    # after that job has spent a full `cargo build --workspace --bins` it does
    # not need, and only for as long as the build script stays `tsc`. The
    # `FrameKind` type changes PR #87 shipped went in on a claim rather than a
    # run: no local toolchain, and `npx tsc` failed in that environment (#94).
    # This is the run — no Rust, no emit, one question.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: TypeScript SDK typechecks
        working-directory: sdk/typescript
        # `npm ci`, not the `npm install` the conformance jobs use: it resolves
        # `package-lock.json` exactly, which pins the compiler at typescript
        # 5.9.3 rather than whatever `^5.9.0` means this week. Same reason the
        # job below pins mypy — a floating strict typechecker turns each of its
        # releases into a possible red main on code nobody touched. The
        # conformance jobs can float because they ask whether the SDK still
        # behaves, not whether a particular compiler still accepts it.
        run: |
          npm ci
          npx tsc --noEmit

  sdk-python-types:
    name: sdk (python) typechecks
    runs-on: ubuntu-latest
    # The Python SDK ships `py.typed`, which promises every downstream
    # typechecker that its annotations are meant to be believed. Nothing
    # checked them, so the promise was untested. `--strict`, because a
    # `py.typed` package that leaks `Any` across its own boundary keeps that
    # promise to its callers and not to itself.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: an unpinned strict typechecker turns each of its releases into
      # a possible red main on code nobody touched. Bumping it is a PR that
      # reads the new diagnostics.
      - run: pip install "mypy==2.3.1"
      - name: Python SDK typechecks
        working-directory: sdk/python
        # `--python-version 3.10`, not the 3.9 floor `pyproject.toml` declares:
        # mypy 2.x refuses to target 3.9 at all, and 3.10 is the nearest target
        # it accepts. The step below covers the floor.
        run: mypy --strict --python-version 3.10 contextgraph_sdk examples
      # The declared floor, typechecked as the floor (#107). mypy 1.20.2 is the
      # last release line that still accepts a 3.9 target, so it gets its own
      # venv rather than sharing one with the 2.x pin above. The target is read
      # from `requires-python`, so raising the floor moves this check with it.
      - name: Python SDK typechecks against its declared floor
        working-directory: sdk/python
        run: |
          floor=$(sed -n 's/^requires-python = ">=\([0-9][0-9.]*\)"$/\1/p' pyproject.toml)
          if [[ -z "$floor" ]]; then
            echo "::error::could not read a '>=X.Y' floor from requires-python in sdk/python/pyproject.toml"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/mypy-floor"
          "$RUNNER_TEMP/mypy-floor/bin/pip" install "mypy==1.20.2"
          "$RUNNER_TEMP/mypy-floor/bin/mypy" --strict --python-version "$floor" contextgraph_sdk examples

  sdk-python-interpreters:
    name: sdk (python) runs on ${{ matrix.role }} interpreter (${{ matrix.python }})
    runs-on: ubuntu-latest
    # `requires-python = ">=3.9"` is a promise to every pip resolver, and every
    # other Python job here pins 3.12, so for a long time nothing ran the SDK
    # on any interpreter but that one (#107). The floor and the newest release
    # are where breakage lives: a 3.10-only syntax or stdlib call fails the
    # first, a removal in a new release fails the second. `3.x` floats on
    # purpose, because the claim has no upper bound and a new interpreter is
    # covered by it the day it ships.
    #
    # No Rust, deliberately: the conformance jobs above each build the whole
    # workspace, and a matrix over them would multiply that for a question the
    # SDK's own unit tests (stdio and HTTP runtimes, attestation vectors)
    # already answer. The TypeScript (`engines.node: ">=18"`) and Go
    # (`go 1.21`) SDKs carry the same shape of claim and are not yet matrixed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: floor
            python: "3.9"
          - role: newest
            python: "3.x"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The matrix hardcodes the floor; `pyproject.toml` declares it. This
      # step makes them one number: moving either without the other fails.
      - name: the floor leg runs the floor pyproject.toml declares
        if: matrix.role == 'floor'
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("sdk/python/pyproject.toml", encoding="utf-8").read()
          found = re.search(r'^requires-python = ">=(\d+)\.(\d+)"$', text, re.M)
          if not found:
              sys.exit("could not read a '>=X.Y' floor from requires-python")
          floor = (int(found[1]), int(found[2]))
          running = sys.version_info[:2]
          if running != floor:
              sys.exit(f"floor leg runs {running}, pyproject.toml declares {floor}")
          print(f"floor leg runs {running}, matching requires-python")
          PY
      - name: SDK and examples compile
        working-directory: sdk/python
        run: python3 -m compileall -q contextgraph_sdk examples
      - name: SDK unit tests pass
        working-directory: sdk/python
        run: python3 -m unittest discover -s tests -v

  sdk-version-pins:
    name: sdk version pins name a version their manifest ships
    runs-on: ubuntu-latest
    # The scaffolder's DEFAULT_SDK table states versions of two packages it
    # does not own, and it sat a full major behind sdk/typescript/package.json
    # for an unknown length of time (#98). The scaffold job below cannot catch
    # that: it overrides both published pins with local paths so CI never
    # depends on a publish — the right call for that job, and the reason this
    # guard is a separate one. Offline, stdlib only, reads no registry.
    # It also reads install commands and dependency lines in tracked Markdown,
    # where two versions had gone stale with no manifest comparison to see
    # them, and refuses a concrete Go SDK version there (#108, ADR 0026).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-sdk-version-pins.py

  sdk-metadata:
    name: sdk packages name the crates' homepage and repository
    runs-on: ubuntu-latest
    # Both npm packages shipped with no `homepage` or `repository`, so their
    # registry pages linked nowhere. The Python package's homepage was the
    # GitHub repo while the crates named the protocol domain (#112). The guard
    # finds manifests by walking sdk/*/ rather than listing them, so a new SDK
    # is held to Cargo.toml's pair from its first commit. Offline, stdlib only.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-sdk-metadata.py

  scaffold-action-pins:
    name: scaffold workflows pin the action majors this repository runs
    runs-on: ubuntu-latest
    # The templates ship a conformance.yml under `_github/`, which the
    # scaffolder renames to `.github/` only at scaffold time. Dependabot scans
    # `.github/workflows` and `.github/actions` alone, so it bumped
    # setup-python to v7 in every workflow here and never saw the template's
    # v5 (#194). The scaffold job runs the conformance script directly and
    # never executes that nested workflow, so nothing green covered it. Same
    # failure mode as ADR 0012, same remedy: an offline guard that fails the
    # commit which opens the gap. Its own job, so a red run names what drifted.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-scaffold-action-pins.py

  guard-self-tests:
    name: CI guard scripts go red on the drift they name
    runs-on: ubuntu-latest
    # A guard that only ever passes proves nothing, and each guard above is
    # judged by the one tree it runs on, where it is green by construction.
    # These tests run the guards against inputs built to be wrong and hold
    # that each goes red: a quoted or SHA-commented stale pin and an unparsed
    # `uses:` line (#207), a creator-applied `P4` or `size/M` (#137), and a
    # changelog with two `## [Unreleased]` headings or none (#149). Offline,
    # stdlib plus jsonschema. Everything in .github/scripts/tests runs here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # validate-examples.py's self-test runs the real gate, which needs
      # jsonschema; its suite fails rather than skips without it.
      - run: pip install jsonschema
      - run: python3 -m unittest discover -s .github/scripts/tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test .github/scripts/tests/triage-guard.test.cjs

  sdk-scaffold:
    name: create-contextgraph-provider scaffolds a conformant project
    runs-on: ubuntu-latest
    env:
      CONTEXTGRAPH_INSPECT: ${{ github.workspace }}/target/debug/contextgraph-inspect
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Build the TypeScript SDK (for the file: dependency)"
        working-directory: sdk/typescript
        run: npm install && npm run build
      - name: Scaffolded TypeScript project is conformant
        run: |
          node sdk/create-contextgraph-provider/index.js /tmp/scaffold-ts \
            --lang typescript --name scaffold-ts --sdk "file:$GITHUB_WORKSPACE/sdk/typescript"
          cd /tmp/scaffold-ts && npm install && npm run build && node scripts/check-conformance.mjs
      - name: Scaffolded Python project is conformant
        run: |
          pip install ./sdk/python
          node sdk/create-contextgraph-provider/index.js /tmp/scaffold-py --lang python --name scaffold_py
          cd /tmp/scaffold-py && python scripts/check_conformance.py

  schema:
    name: schema validates the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 schema/validate-examples.py

  toolchain-pin:
    name: the CI toolchain is pinned on purpose
    runs-on: ubuntu-latest
    # Needs no toolchain of its own — it reads files — so it reports in
    # seconds rather than waiting behind a compile.
    #
    # The pin's failure mode is silence. Re-adding
    # `dtolnay/rust-toolchain@stable` to a new job reads as ordinary
    # copy-paste, and nothing goes red until the next Rust release, weeks after
    # the commit that caused it. Deleting the `msrv` job's `RUSTUP_TOOLCHAIN`
    # override is worse: that job keeps passing and quietly stops testing the
    # MSRV at all. Neither is visible in review, which is what earns them a
    # gate (#160).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-toolchain-pin.py

  deploy-hygiene:
    name: advertised artifact URLs point at a host we serve
    runs-on: ubuntu-latest
    # This repo deploys none of the hosts in the CGP domain family: the Vercel
    # project that owns contextgraphprotocol.org and cgp.oxagen.sh is
    # Git-connected to macanderson/cgp-website, and `site/` deploys nowhere
    # (ADR 0008). So every absolute URL this repo hands third parties for one of
    # its own artifacts — schema, conformance report, badge — has to resolve
    # through GitHub-raw. No build step dereferences a URL, so without this job
    # a dead link ships silently. It already had: the badge docs/registry.md
    # told providers to paste into their READMEs 404ed (#57).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-deploy-hygiene.py

  adr-numbers:
    name: ADR numbers are unique in the merge result
    runs-on: ubuntu-latest
    # Two pull requests each added a differently named `0012-*.md`; git merged
    # both cleanly and every check was green on each, because each branch was
    # valid on its own (#123). A branch-local check cannot see the other pull
    # request, so on a pull request this checks the tree HEAD would produce if
    # merged into the base as the base is *now*, fetched at run time rather
    # than frozen in the merge ref, so a re-run after a colliding ADR lands
    # goes red. On a push to main it checks the tree itself, so a collision
    # that slips past a stale green check reddens the merge that made it.
    steps:
      - uses: actions/checkout@v7
        with:
          # `merge-tree` needs the history back to the merge base.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ADRs in the merge with the current base are one number each
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          python3 .github/scripts/check-adr-numbers.py --against "origin/${GITHUB_BASE_REF}"
      - name: ADRs in this tree are one number each
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/check-adr-numbers.py

  dco:
    name: every commit is signed off (DCO)
    runs-on: ubuntu-latest
    # The license grant here is written as flowing from each contributor's
    # DCO sign-off, and for most of the history nothing checked that the
    # sign-off existed (#141). ADR 0025 chose enforcing the rule over
    # deleting it; this is the enforcement. It reads the commits the pull
    # request adds (base..head), so history before the cut-over is neither
    # checked nor rewritten. Pull requests only: the certification is made on
    # the commits a contributor pushes, and the commit a squash merge writes
    # to main is GitHub's rewrite of those (ADR 0025 covers why that holds).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: every commit this pull request adds is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check-dco.py --range "${BASE_SHA}..${HEAD_SHA}"

  adr-log:
    name: the GUIDE's ADR log indexes every ADR, and ADR numbers are unique
    runs-on: ubuntu-latest
    # docs/GUIDE.md §3 is a shared cell every ADR-adding PR must write, so each
    # PR's tree is fine on its own and a missing row exists only relative to a
    # directory listing nobody compared it against. Three ADRs sat unindexed
    # that way (#129), and two open PRs once each added an ADR 0012, which git
    # would have merged cleanly (#123). This derives the expected rows from
    # docs/adr/*.md on every run, so there is no list here to forget. Its unit
    # tests (tests/test_check_adr_log.py) run in guard-self-tests.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-adr-log.py

  published-crates:
    name: the security policy names every published crate
    runs-on: ubuntu-latest
    # contextgraph-trace was published and SECURITY.md went on listing three
    # crates, so a reporter with a trace bug read a policy that did not mention
    # it (#143). The `publish = true` manifests are the one list that cannot go
    # stale; this holds the prose copies to them. Its unit tests
    # (tests/test_check_published_crates.py) run in guard-self-tests.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-published-crates.py

  protocol-surface-mirror:
    name: protocol-surface mirrors every SPEC.md requirement
    runs-on: ubuntu-latest
    # GOVERNANCE.md names docs/protocol-surface.md's conformance index as the
    # mirror of SPEC.md's requirement tables. When #158 was filed it restated
    # 23 of 57 requirements, and every one it missed was enforced by a
    # conformance check that would fail a provider whose author read only that
    # page. The guard compares the two id sets, in both directions, for any id
    # family. It does not compare wording: the mirror is a summary on purpose,
    # and SPEC.md wins any disagreement.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-protocol-surface-mirror.py

  conformance-counts:
    name: docs state the real number of conformance checks
    runs-on: ubuntu-latest
    # The count drifts every time somebody adds a check, and nothing noticed.
    # #152 was filed when six documents said "five checks" and one said "seven"
    # while the suite ran thirteen — and by the time it was fixed the suite ran
    # fourteen, because `attestation` had landed in between. The same issue
    # found a document citing a `usage-report` check that has never existed in
    # any constant family; a "verified by" cell naming a check nobody wrote
    # reads as evidence and is not.
    #
    # Reading the constants is the only way this stays true without somebody
    # remembering to make it true.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-conformance-counts.py

  doc-types:
    name: docs print the types the crates declare
    runs-on: ubuntu-latest
    # The provider-facing type blocks are duplicated across five documents and
    # nothing tied them to the source, so they drifted. #151 found four ways,
    # two of which would have made a reader build a NON-CONFORMANT provider:
    # `FrameKind` printed as a closed set of seven when the vocabulary is open
    # (SPEC.md §13 U2), and `ContextFrame.content` printed as `String` when a
    # `reference` frame must be able to omit it. It also found the provider
    # guide printing five of the trait's six methods, and a `capabilities()`
    # doc comment describing `upsert`/`subscriptions`/`filters` — three fields
    # ADR 0004 deleted — which the guide had then copied verbatim.
    #
    # Reading the source is the only way the docs stay true without somebody
    # remembering to make them true.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-doc-types.py

  doc-links:
    name: every docs/ path the tree names resolves
    runs-on: ubuntu-latest
    # PR #80 deleted the design-sketch directory and ten citations of it
    # survived — in Rust doc comments, MIGRATION.md, and the crates.io
    # description of a published crate — because nothing reads a path out of
    # prose (#153). The deploy-hygiene job checks absolute artifact URLs only.
    # This reads every repo-relative docs/ path, and every link into this
    # repository's own tree, and fails naming each one that does not exist. Its
    # self-test (tests/test_check_doc_links.py) runs in guard-self-tests.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-doc-links.py

  publish-dry-run:
    name: contextgraph-types packages cleanly (crates.io dry run)
    runs-on: ubuntu-latest
    # Cheap, credential-free proof that the first crate in the publish chain
    # (see PUBLISHING.md) still packages, resolves, and compiles in isolation.
    # `--dry-run` never authenticates and never uploads — it aborts right
    # before that step. Verified: `cargo publish --dry-run -p contextgraph-types`
    # needs no `cargo login` and no CARGO_REGISTRY_TOKEN. Scoped to
    # contextgraph-types only because it's the one crate in the chain with no
    # unpublished workspace-internal dependency to resolve — contextgraph-host
    # and contextgraph-conformance can't dry-run until contextgraph-types is
    # actually live on crates.io (see PUBLISHING.md's note on why local
    # pre-publish verification is asymmetric).
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # `--locked`, matching the real publish in release.yml: a dry run allowed
      # to update Cargo.lock proves something the publish will not do.
      - run: cargo publish --dry-run --locked -p contextgraph-types
