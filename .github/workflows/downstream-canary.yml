name: Downstream Canary

# The code-side half of the #27 boundary enforcement (see ADR 0007's
# Consequences). Downstream docs now hold only a pinned pointer to this repo
# for frame/wire semantics — the risk that remains is a code/type break in
# contextgraph-* that a downstream's pin doesn't surface until a human bumps
# it. This workflow checks both known downstreams against THIS repo's HEAD so
# that break is visible before the freeze, not after: it builds stella, which
# depends on the crates, and replays the fixture sets oxagen vendors through
# this repo's own fixture tests.
#
# Advisory on a pull request, and NOT advisory on the schedule. This repo's own
# gate must stay green on this repo's own guarantees, so a downstream project's
# unrelated churn must never block a merge here — hence `continue-on-error` on
# `pull_request`.
#
# But "advisory" was originally implemented as advisory *everywhere*, and that
# made the canary useless in exactly the case it was built for. On 2026-07-29 it
# caught a real break — stella's `Host::add_http` call had not been updated for
# the C7/C8 credential parameter — emitted its `::warning::`, wrote its step
# summary, and reported the run as **success**. Nobody saw it. stella stayed
# thirteen commits behind for as long as it took a human to go looking.
#
# A warning on a green run is not a signal; it is a note in a file nobody opens.
# So the scheduled run now *fails* on a downstream break. It gates no PR and
# blocks no merge — it has nothing to block — so failing costs nothing and buys
# a red run in the Actions list plus GitHub's scheduled-failure notification.
# The PR path is untouched and still cannot block a merge here.

on:
  schedule:
    # Daily, off the hour, so it doesn't line up with everyone else's cron.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  pull_request:
    # Only when a PR could plausibly move the thing this canary watches —
    # the wire-level crates themselves, or the canary's own definition.
    paths:
      - "contextgraph-types/**"
      - "contextgraph-host/**"
      - "contextgraph-trace/**"
      - "contextgraph-conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/downstream-canary.yml"
      - ".github/scripts/downstream-canary-stella.sh"
      - ".github/scripts/downstream-canary-oxagen.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  stella-canary:
    name: stella builds against CGP HEAD (advisory on PR, gating on schedule)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout context-graph-protocol (this repo, HEAD)
        uses: actions/checkout@v7
        with:
          path: cgp

      - name: Checkout stella (public)
        uses: actions/checkout@v7
        with:
          repository: macanderson/stella
          path: stella

      - uses: ./cgp/.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cgp
            stella

      - name: Build + test stella's contextgraph-* consumers against local HEAD
        id: build
        continue-on-error: true
        env:
          CGP_DIR: ${{ github.workspace }}/cgp
          STELLA_DIR: ${{ github.workspace }}/stella
        run: ./cgp/.github/scripts/downstream-canary-stella.sh

      # `continue-on-error` above is unconditional so that this step always runs
      # and always records what happened. Whether the *job* then goes red is
      # decided here, by event: a scheduled run fails, a pull request does not.
      - name: Flag the break (fails the scheduled run; advisory on a PR)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning title=downstream canary::stella no longer builds against context-graph-protocol HEAD (${{ github.sha }}) — a breaking change to contextgraph-types::ContextFrame or another wire type likely needs a coordinated stella update before the next freeze/tag."
          {
            echo "### :warning: Downstream canary: \`stella\` failed"
            echo
            echo "stella (macanderson/stella) no longer builds/tests against this repo's HEAD (\`${{ github.sha }}\`). See the \`build\` step log above for the compiler error."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Advisory on a pull request: a downstream repo does not block a merge here."
            echo "_Advisory on a PR — this does not block the merge._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Scheduled or manually dispatched: gate nothing, block nothing, so
          # failing is free — and a red run is the only form of this signal that
          # actually reaches a human.
          echo "Scheduled run: failing so the break is visible rather than a warning on a green run."
          echo "_Scheduled run — failed deliberately so this reaches a human._" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  oxagen-canary:
    name: oxagen's vendored CGP fixtures replay against CGP HEAD (advisory on PR, gating on schedule)
    runs-on: ubuntu-latest
    steps:
      # oxagen (macanderson/oxagen, public) vendors two of this repo's fixture
      # sets — the contextgraph-1.0 golden profile and the contextgraph-trace
      # journals — each beside a manifest.json naming this repo, the commit it
      # was copied at, and a sha256 per file. It consumes data, not crates, so
      # this half replays those copies through HEAD's own fixture tests rather
      # than building oxagen (the script's docstring has the full argument).
      #
      # This job used to check out `macanderson/oxagen-platform` behind an
      # OXAGEN_PLATFORM_TOKEN gate and, with no token, report success having
      # checked nothing (#104). That repository does not exist; the one it
      # meant is public and needs no secret (#139).
      - name: Checkout context-graph-protocol (this repo, HEAD)
        uses: actions/checkout@v7
        with:
          path: cgp

      # Sparse, because oxagen is a large monorepo and only its fixture
      # directories matter. The pattern matches by shape, not package name, so
      # a set oxagen vendors into a new package is still discovered, and one
      # the script cannot replay fails the run instead of going unchecked.
      - name: Checkout oxagen (public, fixture directories only)
        uses: actions/checkout@v7
        with:
          repository: macanderson/oxagen
          path: oxagen
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /packages/*/fixtures/**

      - uses: ./cgp/.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cgp

      - name: Replay oxagen's vendored fixtures through this HEAD's fixture tests
        id: replay
        continue-on-error: true
        env:
          CGP_DIR: ${{ github.workspace }}/cgp
          OXAGEN_DIR: ${{ github.workspace }}/oxagen
        run: python3 ./cgp/.github/scripts/downstream-canary-oxagen.py

      # Same event split as stella-canary above: a scheduled run fails, a pull
      # request does not.
      - name: Flag the break (fails the scheduled run; advisory on a PR)
        if: steps.replay.outcome == 'failure'
        run: |
          echo "::warning title=downstream canary::a fixture set oxagen vendors no longer passes this repo's fixture tests at HEAD (${{ github.sha }}) — oxagen needs to re-vendor, or this change broke a contract oxagen pins."
          {
            echo "### :warning: Downstream canary: \`oxagen\` failed"
            echo
            echo "A fixture set oxagen (macanderson/oxagen) vendors from this repo no longer passes against HEAD (\`${{ github.sha }}\`). See the \`replay\` step log above for the failing test."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Advisory on a pull request: a downstream repo does not block a merge here."
            echo "_Advisory on a PR — this does not block the merge._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Scheduled run: failing so the break is visible rather than a warning on a green run."
          echo "_Scheduled run — failed deliberately so this reaches a human._" >> "$GITHUB_STEP_SUMMARY"
          exit 1
